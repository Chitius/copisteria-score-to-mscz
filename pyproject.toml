[project]
name = "copisteria-score-to-mscz"
version = "0.2.1"
description = "Turn printed score PDFs into reviewed MusicXML/MuseScore editions"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "pillow>=9",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "jsonschema>=4.20",
]

[project.urls]
Homepage = "https://github.com/Chitius/copisteria-score-to-mscz"
Repository = "https://github.com/Chitius/copisteria-score-to-mscz"
Issues = "https://github.com/Chitius/copisteria-score-to-mscz/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scorepipe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
