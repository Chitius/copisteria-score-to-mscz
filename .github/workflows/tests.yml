name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    # MuseScore- and poppler-dependent tests skip themselves when the tool is absent, so the
    # suite runs on a bare runner across both Windows and Linux.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check scorepipe scripts tests
      - name: Run tests
        run: python -m pytest tests -q
