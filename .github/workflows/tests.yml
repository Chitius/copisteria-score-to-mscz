name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    # MuseScore- and poppler-dependent tests skip themselves when the tool is absent, so the
    # suite runs on a bare runner. Windows matches the primary supported platform.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Run tests
        run: python -m pytest tests -q
